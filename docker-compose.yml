# Three services: web (Next.js), socket (Socket.IO server), nginx (the
# only one that publishes a host port — see nginx/default.conf for why
# everything rides one public origin). HTTP_PORT/CLIENT_ORIGIN are
# overridable via a .env file (see .env.example) without editing this
# file — real domain/TLS decisions belong to the deploy step, not here.
services:
  web:
    # No build args: the image defaults to a same-origin Socket.IO
    # connection through nginx automatically (see
    # src/context/SocketContext.tsx and Dockerfile.web's comments) — no
    # NEXT_PUBLIC_SOCKET_URL needed for the normal case.
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    environment:
      SOCKET_PORT: "4000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - socket
    restart: unless-stopped
