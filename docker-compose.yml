# Three services: web (Next.js), socket (Socket.IO server), nginx (the
# only one that publishes a host port — see nginx/default.conf for why
# everything rides one public origin). HTTP_PORT/CLIENT_ORIGIN are
# overridable via a .env file (see .env.example) without editing this
# file — real domain/TLS decisions belong to the deploy step, not here.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Empty on purpose: same-origin through nginx (see
        # src/context/SocketContext.tsx). Baked in at build time since
        # NEXT_PUBLIC_* vars are inlined into the client bundle.
        NEXT_PUBLIC_SOCKET_URL: ""
    restart: unless-stopped

  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    environment:
      SOCKET_PORT: "4000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - socket
    restart: unless-stopped
