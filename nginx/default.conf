# Single public origin for the whole app: everything comes through this one
# nginx listener so the browser never has to make a cross-origin request to
# reach the Socket.IO server (see src/context/SocketContext.tsx's
# same-origin SOCKET_URL). Service names (web, socket) resolve via Docker
# Compose's built-in DNS — only nginx publishes a host port.

server {
    listen 80;

    # Socket.IO's own path — matched first (nginx picks the most specific
    # matching location), proxied to the socket container with the
    # WebSocket upgrade headers it needs to move off long-polling.
    location /socket.io/ {
        proxy_pass http://socket:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the Next.js app.
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
